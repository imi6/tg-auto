version: '3.8'

services:
  tg-monitor:
    # 使用 GitHub Container Registry 预构建镜像
    image: ghcr.io/imi6/tg-auto:latest

    # 如需本地构建，注释掉上面的 image，取消注释下面的 build
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: telegram-monitor
    restart: always

    # 端口映射
    ports:
      - "8000:8000"

    # 环境变量配置（可选，后台可配置）
    environment:
      # Web 界面认证（建议修改默认密码）
      - WEB_USERNAME=admin
      - WEB_PASSWORD=admin123

      # Web 服务配置
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - WEB_DEBUG=false

    # 数据持久化
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./sessions:/app/sessions

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
